<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe3;--card:#fffdf6;--ink:#2b2a22;--mute:#7a7664;--palm:#3f6b3a;--buy:#9a5b13;--line:#ddd6bf;--warn:#a4452c}
@media (prefers-color-scheme:dark){:root{--bg:#1b1f1a;--card:#252b23;--ink:#ece8d8;--mute:#a09c88;--palm:#8fc283;--buy:#e3b268;--line:#3a4236;--warn:#e08a6f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;line-height:1.7;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:800}
label{display:block;font-size:.9rem;color:var(--mute);margin-bottom:8px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px;background:var(--palm);color:var(--bg);width:100%;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--palm);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bar button{width:auto;background:none;color:var(--mute);border:1px solid var(--line);padding:6px 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px}
.tabs button.on{background:var(--palm);color:var(--bg);border-color:var(--palm)}
.tag{display:inline-block;font-size:.8rem;font-weight:800;padding:0 10px;border-radius:99px;border:1.5px solid;color:var(--palm)}
.tag.buy{color:var(--buy)}
.top{display:flex;justify-content:space-between;align-items:center}
.big{font-size:1.15rem;font-weight:800;margin:6px 0 0}
.meta,.empty{color:var(--mute);font-size:.9rem}
.act{display:flex;gap:8px;margin-top:10px}
.act a{flex:1;text-align:center;text-decoration:none;font-weight:500;padding:10px;border-radius:10px;background:var(--palm);color:var(--bg)}
.act button{width:auto;background:none;color:var(--warn);border:1px solid var(--line);padding:10px 14px}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>سوق الديرة</h1>
<p class="sub">بيع محصولك أو اطلب ما تحتاجه من مزارعي منطقتك.</p>
<div id="msg" class="note" hidden></div>

<div id="login" class="card" hidden>
<h2>سجّل الدخول لتصفح الإعلانات</h2>
<p class="meta">نطلب تسجيل الدخول لحماية أرقام هواتف المزارعين من الغرباء.</p>
<button id="signin">الدخول بحساب جوجل</button>
</div>

<div id="app" hidden>
<div class="bar"><span class="meta" id="who"></span><button id="signout">خروج</button></div>
<div class="card">
<h2>إضافة إعلان</h2>
<div class="row">
<label>النوع<select id="kind"><option value="sell">أبيع</option><option value="buy">أريد شراء</option></select></label>
<label>المحصول<select id="crop"><option>تمر</option><option>قمح</option><option>شعير</option><option>طماطم</option><option>خيار</option><option>بطاطا</option><option>رز</option><option>أعلاف</option><option>أخرى</option></select></label>
</div>
<div class="row">
<label>الكمية بالكيلوغرام<input id="qty" type="number" min="1" inputmode="numeric"></label>
<label>السعر للكيلو بالدينار<input id="price" type="number" min="0" inputmode="numeric"></label>
</div>
<div class="row">
<label>المنطقة<input id="area" maxlength="50" placeholder="مثال: الزبير"></label>
<label>رقم الهاتف<input id="phone" type="tel" inputmode="tel" maxlength="16" placeholder="07xxxxxxxxx"></label>
</div>
<button id="add">نشر الإعلان</button>
</div>
<div class="tabs" id="tabs"><button data-f="all" class="on">الكل</button><button data-f="sell">معروض</button><button data-f="buy">مطلوب</button></div>
<div id="list"><p class="empty">جارٍ التحميل…</p></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyClya3ixA908mXSeiwjbeY930Ek17v5MO4",
  authDomain: "deira---market.firebaseapp.com",
  projectId: "deira---market",
  storageBucket: "deira---market.firebasestorage.app",
  messagingSenderId: "187350601347",
  appId: "1:187350601347:web:5442afe68deee3658415b6"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let me = null, items = [], filter = "all", unsub = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("ar-IQ");
const ago = ts => { const m = Math.round((Date.now() - ts) / 60000); if (m < 2) return "الآن"; if (m < 60) return "قبل " + m + " دقيقة"; const h = Math.round(m / 60); return h < 24 ? "قبل " + h + " ساعة" : "قبل " + Math.round(h / 24) + " يوم"; };
const note = t => { $("msg").textContent = t; $("msg").hidden = !t; };

function render() {
  const rows = items.filter(x => filter === "all" || x.kind === filter);
  if (!rows.length) { $("list").innerHTML = '<p class="empty">لا توجد إعلانات هنا بعد. كن أول من ينشر.</p>'; return; }
  $("list").innerHTML = rows.map(x => {
    const phone = String(x.phone || "").replace(/[^0-9+]/g, "");
    return `<div class="card"><div class="top"><span class="tag ${x.kind === "sell" ? "" : "buy"}">${x.kind === "sell" ? "معروض" : "مطلوب"}</span><span class="meta">${ago(x.ts)}</span></div>
<p class="big">${esc(x.crop)} — ${fmt(x.qty)} كغم</p>
<div class="meta">السعر: ${fmt(x.price)} دينار للكيلو • ${esc(x.area)}</div>
<div class="act">${phone ? `<a href="tel:${phone}">اتصال: ${esc(x.phone)}</a>` : ""}${x.owner === me ? `<button data-del="${esc(x.id)}">حذف</button>` : ""}</div></div>`;
  }).join("");
}

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { me = null; $("login").hidden = false; $("app").hidden = true; return; }
  me = user.uid; $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = user.displayName || user.email || "";
  unsub = onSnapshot(query(collection(db, "listings"), orderBy("ts", "desc"), limit(100)),
    snap => { items = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    () => note("تعذّر تحميل الإعلانات. تحقق من قواعد الأمان في Firebase."));
});

$("signin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => note("تعذّر تسجيل الدخول: " + e.code));
$("signout").onclick = () => signOut(auth);

$("tabs").onclick = e => {
  const f = e.target.dataset.f; if (!f) return; filter = f;
  [...$("tabs").children].forEach(b => b.className = b.dataset.f === f ? "on" : ""); render();
};

$("list").onclick = async e => {
  const id = e.target.dataset.del;
  if (id && confirm("حذف هذا الإعلان؟")) { try { await deleteDoc(doc(db, "listings", id)); } catch { note("تعذّر الحذف."); } }
};

$("add").onclick = async () => {
  const qty = parseFloat($("qty").value), price = parseFloat($("price").value);
  const area = $("area").value.trim(), phone = $("phone").value.trim();
  if (!(qty > 0) || !(price >= 0) || !area || phone.replace(/\D/g, "").length < 10) { alert("أكمل الكمية والسعر والمنطقة، واكتب رقم هاتف صحيحًا."); return; }
  $("add").disabled = true;
  try {
    await addDoc(collection(db, "listings"), { kind: $("kind").value, crop: $("crop").value, qty, price, area, phone, owner: me, ts: Date.now() });
    ["qty", "price", "area", "phone"].forEach(i => $(i).value = ""); note("");
  } catch { note("تعذّر النشر. تحقق من الاتصال ومن قواعد الأمان."); }
  $("add").disabled = false;
};
</script>
</body>
</html>
